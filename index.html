<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#c6e4ff}
.fondo{
  position:fixed;inset:0;
  background:url('stitch_vertical.jpg') center / cover no-repeat;
  z-index:0;
}
@media(min-width:900px){
  .fondo{background:url('stitch_pc.jpg') center / cover no-repeat;}

.container{
  position:relative;z-index:10;width:92%;max-width:370px;
  background:rgba(255,255,255,0.85);backdrop-filter:blur(18px);
  border:2.5px solid #8ec6ff;border-radius:30px;
  padding:30px 24px;text-align:center;
  box-shadow:0 12px 35px rgba(80,140,255,0.3), 0 0 0 5px rgba(255,255,255,0.7);
}
.avatar{
  width:130px;height:130px;border-radius:50%;border:3.5px solid #4a90ff;
  margin:0 auto 14px;background:url('melanie_avatar_hd.jpg') center top / cover no-repeat;
  box-shadow:0 0 0 4px white, 0 0 25px rgba(74,144,255,0.6);
}
h1{font-size:24px;color:#2a6bff}
.user{font-size:12px;color:#5a9bff;margin:4px 0 20px;font-weight:600}
.link{
  display:flex;justify-content:center;gap:8px;
  width:100%;padding:13px;margin:11px 0;border-radius:50px;
  text-decoration:none;color:white;font-weight:700;font-size:14.5px;
  box-shadow:3px 3px 0 #000;border:2px solid #000;transition:0.15s;
}
.link:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.tiktok{background:#000}.whatsapp{background:linear-gradient(90deg,#128C7E,#25D366)}
.instagram{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.facebook{background:linear-gradient(90deg,#1877F2,#4a7fe8)}
.footer{margin-top:16px;font-size:11px;color:#7fb3ff;font-weight:600}
</style>
</head>
<body>
<div class="fondo"></div>
